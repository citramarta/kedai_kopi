<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pesan - Kedai Kopi Senja</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Kedai Kopi Senja</h1>
    <nav>
      <ul>
        <li><a href="index.html">Beranda</a></li>
        <li><a href="menu.html">Menu</a></li>
        <li><a href="pesan.html">Pesan</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Form Pemesanan</h2>

    <form action="pesan.html" method="get">
      <p>
        <label for="nama">Nama pemesan</label>
        <input type="text" id="nama" name="nama" required>
      </p>

      <p>
        <label for="wa">Nomor WhatsApp</label>
        <input type="tel" id="wa" name="wa" required>
      </p>

      <p>
        <label for="menu">Pilihan menu</label>
        <select id="menu" name="menu" required>
          <option value="">-- Pilih menu --</option>
          <optgroup label="Kopi">
            <option value="espresso">Espresso</option>
            <option value="americano">Americano</option>
            <option value="kopi-susu-gula-aren">Kopi Susu Gula Aren</option>
          </optgroup>
          <optgroup label="Non Kopi">
            <option value="matcha-latte">Matcha Latte</option>
            <option value="cokelat-panas">Cokelat Panas</option>
            <option value="teh-tarik">Teh Tarik</option>
          </optgroup>
        </select>
      </p>

      <p>
        <label for="jumlah">Jumlah (1-10)</label>
        <input type="number" id="jumlah" name="jumlah" min="1" max="10" value="1" required>
      </p>

      <fieldset>
        <legend>Cara ambil</legend>
        <input type="radio" id="ambil" name="cara" value="ambil" checked>
        <label for="ambil">Ambil di tempat</label><br>
        <input type="radio" id="antar" name="cara" value="antar">
        <label for="antar">Diantar</label>
      </fieldset>

      <p>
        <label for="catatan">Catatan</label>
        <textarea id="catatan" name="catatan" rows="4" cols="40"></textarea>
      </p>

      <p><button type="submit">Kirim</button></p>
    </form>
  </main>

  <footer>
    <p>Alamat: Jl. Kopi Nusantara No. 12, Semarang</p>
    <p>Jam buka: setiap hari, 08.00 - 22.00</p>
  </footer>
</body>
</html>
